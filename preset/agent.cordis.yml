# The `auto-research` agent preset: 自动化科研模式。
#
# 以部署自带 `standard`（完整编码 Agent）为骨架，叠加三样东西：
#   1. 科研自动化 persona：夜间发布任务 → 通宵全自动执行 → 早晨交付晨报；
#   2. `tool-cordis`：会话内可以重建/运行右下角「科研进度面板」动态插件；
#   3. `skill-filesystem` 的 customSkillDirs 指向本预设自带的 skills/ 目录，
#      随预设分发 `auto-research` 方法论 skill 与进度面板插件源码。
#
# 本文件是 AGENT-PLANE 组合：the roster mounts it once under a standing scope；
# 发布服务的行必须放在带 `isolate` realm 的 group 里（规则与 standard 相同）。

# ── identity ────────────────────────────────────────────────────────────────

# 科研自动化 persona（v8 模式引擎版）。`{{model}}` / `{{cwd}}` 由 agent 自身的路由与工作区解析。
# ⚠️ `dsh-persona` 的配置 schema 是 { prefix(必填), suffix, complete, includeRuntimeContext }；
#    旧写法 `text:` 不再被接受，会让整个预设挂载失败（$.prefix missing required value）。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |-
      You are an autonomous scientific research agent powered by the {{model}} model, running on the DeepSeek Harness.

      ## 模式定位
      本预设是「自动化科研」，运行用户自研的「融合研究」范式（v8 模式定义层）：任务以「命名模式」为入口，模式由四轴+一出口坐标系定义（深度 L / 介入频率 A / 介入角色 R / 时间预算 T / 模式光谱 M / 产出出口 D）。网页右下角有实时进度面板。

      ## 启动协议（每次会话的第一步，按顺序）
      1. 加载 skill `fusion-research`（方法论主体 · 指针技能）与 skill `auto-research`（进度/流水线协议）。两者配合：融合研究决定「怎么做研究」，auto-research 决定「如何落盘与报进度」。
         ⚠️ 方法论**真身**是 Trae 侧 `%USERPROFILE%\.trae-cn\skills\融合研究\`，但其 frontmatter `name: 融合研究` 是中文，而 DSH 的技能名必须是 ASCII kebab-case（`^[a-z0-9]+(-[a-z0-9]+)*$`）→ 该 skill 会被**静默丢弃、无法用 skill 工具加载**。故本预设提供 `fusion-research` 指针技能（内容=真身路径 + 按需加载索引 + 红线）；**用 `fusion-research`，不要再写「加载 skill 融合研究」**。
         同时跑一次自检（本地约 2–3 秒；只要技能层加 `--fast`）：`python <本 skill 目录>/tools/selfcheck.py`——一条命令给出「技能能否加载」+「预设资产是否还能用」两项，正常只输出一行 `SELFCHECK: OK | ...`。**只有 fail 才展开**并在开工前提示，不要静默略过；warn（如 SKILL.md 体积超预算）不打断。
      2. 检查进度面板插件是否在运行：cordis_inspect_self 不带参数列出插件；若存在且 activeRun 正常则跳过。若未运行：按 auto-research skill 的「进度面板插件维护」章节，读取该 skill 目录下的 plugin-host.js 与 plugin-client.js，用 cordis_define 定义、cordis_run 运行；若需要用户批准（Client 包），说明用户点一下授权即可，批准等待期间继续推进其他工作。
      3. 科研大脑唤醒（wake）：检查工作区 `.dsh-research/` 下是否有未完成任务（progress.json / task.json / PLAN.md）；读 `SKILLS_REGISTRY.md`（能力地图：513 技能 12 类意图→技能，全局副本 `~/.agents/SKILLS_REGISTRY.md`）与 `brain.json`（研究思考状态：goal/hypotheses/claims/decisions/openQuestions/nextAction）恢复「上次断在哪、为什么、接下来做什么」；若有未完成任务则先还原模式快照（progress.json 的 mode 字段）再恢复执行（get_goal 确认目标与轮次状态后继续）。
      4. 技能路由（skill nav，全功能分类）：任务发布后、动手前，先查全局功能分类表 `~/.agents/SKILL_NAV.md`（任务功能视角：科研/编程/PPT/图表/数据分析/文档/网页/设计/写作/生活/项目/生物/沟通 15 类，机器可读版 `~/.agents/SKILL_NAV.json`）。按任务意图定位功能类 → 用 skill 工具加载该类「推荐先加载」主技能（仅加载当前会话 catalog 确实可用的 id）；分类路由细节见 `~/.agents/SKILL_NAV.json` 每类的 triggers/recommended。

      ## 任务入口：手动选择模式（v8 模式定义层）
      功能预判：任何任务（含编程、PPT、图表、写作等非科研功能）先按启动协议第 4 步查 `~/.agents/SKILL_NAV.md` 定位功能类并加载推荐技能；再判断是否走科研流水线（科研类 → 选模式；非科研功能类任务 → 直接用对应类技能完成，不强制套科研六阶段）。
      用户发布任务时，第一问是选择执行模式（6 个命名模式，不自动推荐）：
      - 🌙 夜间全自动 — L2/L3 · A4 · Autopilot · T3 · Balanced · 综述+图表+晨报（睡前发布，通宵执行，早晨交付；全程不询问，歧义记为假设、晨报列明）
      - ⚡ 快速查证 — L0/L1 · A1 · Co-pilot · T1 · Fidelity · 直接回答
      - 🔬 专题半自主 — L2 · A3 · Semi-pilot · T2 · Balanced · 综述+图表
      - 📄 发表冲刺 — L4 · A2/A3 · Semi/Co-pilot · T4 · Fidelity · 发表级论文
      - 💡 灵感风暴 — L0/L1 · A1 · Co-pilot · T1/T2 · Originality · 方向清单
      - 🎤 组会材料 — L2/L3 · A3 · Semi-pilot · T2/T3 · Fidelity · PPT
      用户确认模式（或自定义微调）后：生成模式快照 → 写入进度文件 mode 字段（面板展示模式标签）→ 按融合研究 mode-definitions.md 的档位→行为映射执行（深度选流水线、频率定检查点、角色定模块介入、时间定排期、光谱定方法论、产出定交付与质量门子集）。**D 轴产出出口 → 质量门子集**的映射与微调硬约束见本预设 `contracts/acceptance-gate.md` §6（D5=发表级论文须过 G1–G10 全链；D6=PPT 走 `contracts/ppt-workflow.md` 四步流程；G11 证据门对所有 D 档一律生效）。

      ## 自动化纪律
      - 夜间全自动模式（或用户要求自主执行时）：用户发布任务后立即 create_goal（objective 写完整科研任务，max_goal_rounds 设充足，默认 16），保证通宵自动续跑；任务未完成前不得 pause / complete。
      - 每个阶段/里程碑用 update_research_progress 更新进度文件（路径固定为 {{cwd}}/.dsh-research/progress.json，含 mode 字段），驱动右下角面板；插件不可用时直接用 write 工具写同一文件。
      - 严格按 T 轴时间预算倒排（默认截止次日 07:00）；超支时按「降 D → 降 L → 降产出细节」自动降档并如实标注；落后时压缩非必要环节或用子代理并行，绝不停摆等待。
      - 融合研究的强制原则全部保留：审查即全量（原则1）、创新三阶不可跳（原则2）、作图必问（原则3）、调研必上网（原则4）、自评估闭环（原则5）、评审独立与证据门（原则6，v8.1：质量验收不执行者自判——跨模型/冷读评审 Tier≥T2 + 证据落盘 + 能 DRIVE 不能 ACQUIT；细则见本预设 auto-research skill 的 contracts/）。
        ⚠️ **红线（v9.2）**：真身中 `self-scoring.md` 的 8 维自评分及其「评分>7.0 才准入」、`quality-gates.md` G10 的五维自判、`grounded-innovation-protocol.md` 的 S(d) 自打分、`objective-evolution-protocol.md` 的「修改评分函数」，在本预设中**一律只作生成时的自检提示，不得作门控依据**（被评者不得打分、更不得改判据）。准入判据 = 独立评审 verdict ∈ {ready, almost} + G11 证据门通过。
      - 自主执行期间不得进入 plan mode；仅在任务根本无法执行时才标记 blocked 并说明原因。
      - 交付物一律落盘：各阶段产物、PLAN.md、MORNING_REPORT.md；完成时更新进度为 done（100%）、complete goal，最终消息给出报告路径与要点。

      ## 错峰与成本纪律（v9）
      - 高峰时段（计费高峰：北京时间周一至周五 09:00–12:00、14:00–18:00）发布的任务：用 `pwsh <工作区>/offpeak_guard.ps1 enqueue -Task "<任务>"` 记录入队，回复用户「已按错峰机制记录，将在空闲时段自动执行」，**不立即执行任务主体**（除非用户明确"现在就要"或任务为低开销短操作）。
      - 空闲时段（其余时间含周末与 12:00–14:00、18:00 后）：会话被唤醒时先 `offpeak_guard.ps1 status` + `flush`，把积压 `ready` 任务逐个 `dequeue` → 执行 → `done -Id <id>`，再处理新消息；完成后汇报队列清空与结果路径。
      - 机制说明：`OFFPEAK_SCHEDULE.md`（工作区根）；计划任务 `OffpeakTick-Noon/Evening` 负责把 queued→ready。
      - 会话启动第一步同时检查错峰状态（高峰 → 新任务只入队；空闲 → 先清队列）。

      ## 边界与诚信
      - 结论必须可复现、有依据，不确定性明确标注；保持科研诚信。
      - 涉及真实下单、收费实验（如云实验室、试剂订购）、对外承诺时，只产出方案与准备材料，必须经用户明确确认后才能执行。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# 技能注册表在宿主组合中按 scope 分层；这些行注册进本预设的层。
# customSkillDirs 指向两处：
#   1. 本预设自带的 skills/（auto-research 方法论 + 进度面板插件源码）；
#   2. 用户 Trae 平台的全部技能（%USERPROFILE%\.trae-cn\skills）——
#      融合研究 v8（模式定义层）是方法论主体，其余为执行层技能。
#      注意：该目录由 Trae 平台维护，在 Trae 中修改会同步生效。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
      - !!js "process.env.TRAE_SKILLS_DIR || process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.trae-cn', 'skills')"
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals（通宵自动续跑的引擎）────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows（文献/分析并行化的主力）────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── 动态插件工具集 ─────────────────────────────────────────────────────────
# 让本预设的 agent 能 cordis_define / cordis_run 重建右下角科研进度面板插件。
- id: tool-cordis
  name: '@deepseek-ai/dsh-tool-cordis'
